<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goaldle Video Upload Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #1a202c;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding: 0;
            margin: 0;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background: #2d3748;
            border-bottom: 3px solid #4a5568;
            padding: 20px;
            margin: -20px -20px 30px -20px;
            border-radius: 0 0 10px 10px;
        }
        
        h1 {
            font-size: 2.0rem;
            margin: 0;
            font-weight: 700;
            color: #e2e8f0;
            text-align: center;
        }
        
        .upload-section {
            background: #2d3748;
            border: 2px solid #4a5568;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 20px;
        }
        
        .upload-area {
            border: 2px dashed #4a5568;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            margin: 20px 0;
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .upload-area:hover {
            border-color: #3182ce;
            background: rgba(49, 130, 206, 0.1);
        }
        
        .upload-area.dragover {
            border-color: #3182ce;
            background: rgba(49, 130, 206, 0.2);
        }
        
        .upload-text {
            color: #a0aec0;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }
        
        .btn {
            background: #3182ce;
            color: white;
            border: 2px solid #2c5282;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .btn:hover:not(:disabled) {
            background: #2c5282;
        }
        
        .btn:disabled {
            background: #4a5568;
            border-color: #4a5568;
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        .file-info {
            color: #e2e8f0;
            margin-top: 15px;
            font-size: 0.9rem;
        }
        
        .progress {
            margin: 20px 0;
            display: none;
        }
        
        .progress-text {
            color: #a0aec0;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #4a5568;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: #3182ce;
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }
        
        .result.success {
            background: rgba(5, 150, 105, 0.3);
            border: 2px solid #059669;
        }
        
        .result.error {
            background: rgba(220, 38, 38, 0.3);
            border: 2px solid #dc2626;
        }
        
        video {
            width: 100%;
            max-width: 100%;
            border-radius: 8px;
            margin-top: 15px;
            background: #000;
        }
        
        .download-btn {
            margin-top: 15px;
            background: #059669;
            border-color: #047857;
        }
        
        .download-btn:hover {
            background: #047857;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚽ Goaldle Video Upload Test ⚽</h1>
        </div>
        
        <div class="upload-section">
            <div class="upload-area" id="uploadArea">
                <div class="upload-text">📹 Drop your video file here or click to select</div>
                <input type="file" id="videoFile" accept="video/*" style="display: none;">
                <div id="fileInfo" class="file-info" style="display: none;"></div>
            </div>
            
            <div style="text-align: center;">
                <button id="uploadBtn" class="btn" onclick="uploadVideo()" disabled>
                    🚀 Process Video
                </button>
            </div>
        </div>
        
        <div class="progress" id="progress">
            <div class="progress-text">Processing video... This may take a few minutes.</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        
        <div class="result" id="result">
            <div id="resultContent"></div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const videoFile = document.getElementById('videoFile');
        const uploadBtn = document.getElementById('uploadBtn');
        const progress = document.getElementById('progress');
        const result = document.getElementById('result');
        const resultContent = document.getElementById('resultContent');

        // Drag and drop functionality
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                videoFile.files = files;
                handleFileSelect();
            }
        });

        // Single click handler for upload area
        uploadArea.addEventListener('click', () => {
            videoFile.click();
        });

        videoFile.addEventListener('change', handleFileSelect);

        function handleFileSelect() {
            const file = videoFile.files[0];
            if (file) {
                uploadBtn.disabled = false;
                
                // Update the upload area to show selected file
                const uploadText = uploadArea.querySelector('.upload-text');
                const fileInfo = document.getElementById('fileInfo');
                
                uploadText.innerHTML = '✅ File Selected';
                fileInfo.innerHTML = `<strong>${file.name}</strong><br>Size: ${(file.size / 1024 / 1024).toFixed(2)} MB`;
                fileInfo.style.display = 'block';
                
                uploadArea.style.borderColor = '#059669';
                uploadArea.style.background = 'rgba(5, 150, 105, 0.1)';
            }
        }

        async function uploadVideo() {
            const file = videoFile.files[0];
            if (!file) {
                alert('Please select a video file first');
                return;
            }

            // Show progress
            progress.style.display = 'block';
            result.style.display = 'none';
            uploadBtn.disabled = true;

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/process-video', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    // Success
                    result.className = 'result success';
                    result.style.display = 'block';
                    
                    resultContent.innerHTML = `
                        <h3>✅ Video processed successfully!</h3>
                        <p><strong>Video Info:</strong></p>
                        <ul>
                            <li>Resolution: ${data.video_info.width}x${data.video_info.height}</li>
                            <li>FPS: ${data.video_info.fps}</li>
                            <li>Frames: ${data.video_info.frames}</li>
                        </ul>
                        <p><strong>Blurred Video:</strong></p>
                        <video controls>
                            <source src="data:video/mp4;base64,${data.blurred_video}" type="video/mp4">
                            Your browser does not support the video tag.
                        </video>
                        <br><br>
                        <a href="data:video/mp4;base64,${data.blurred_video}" download="blurred_video.mp4">
                            <button class="btn download-btn">📥 Download Blurred Video</button>
                        </a>
                    `;
                } else {
                    // Error
                    result.className = 'result error';
                    result.style.display = 'block';
                    resultContent.innerHTML = `
                        <h3>❌ Processing failed</h3>
                        <p>Error: ${data.error}</p>
                    `;
                }
            } catch (error) {
                // Network error
                result.className = 'result error';
                result.style.display = 'block';
                resultContent.innerHTML = `
                    <h3>❌ Upload failed</h3>
                    <p>Network error: ${error.message}</p>
                `;
            } finally {
                progress.style.display = 'none';
                uploadBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
