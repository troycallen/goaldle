<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Goaldle</title>
    <link rel="icon" type="image/png" href="favicon.png" id="favicon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a202c;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding: 0;
            margin: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .header {
            background: #2d3748;
            border-bottom: 3px solid #4a5568;
            padding: 10px 20px;
            margin: 0 0 20px 0;
            width: 100vw;
            margin-left: calc(-50vw + 50%);
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            width: 100%;
            padding: 0 40px;
        }

        .nav-links:first-child {
            justify-self: start;
        }

        .nav-links:last-child {
            justify-self: end;
        }

        h1 {
            font-size: 2.0rem;
            margin: 0;
            font-weight: 700;
            color: #e2e8f0;
            text-align: center;
            justify-self: center;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .nav-separator {
            color: #4a5568;
            font-weight: 300;
            user-select: none;
        }

        .nav-link {
            color: #a0aec0;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .nav-link:hover {
            color: #e2e8f0;
        }

        .contact-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: left;
        }

        .page-title {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 40px;
            color: #e2e8f0;
        }

        .contact-form {
            background: #2d3748;
            border: 2px solid #4a5568;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #81c4f7;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #4a5568;
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 16px;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3182ce;
            background: rgba(49, 130, 206, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .submit-btn {
            background: #3182ce;
            color: white;
            border: 2px solid #2c5282;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.2s;
            width: 100%;
        }

        .submit-btn:hover:not(:disabled) {
            background: #2c5282;
        }

        .submit-btn:disabled {
            background: #4a5568;
            border-color: #4a5568;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .contact-info {
            background: #2d3748;
            border: 2px solid #4a5568;
            border-radius: 10px;
            padding: 25px;
            text-align: center;
        }

        .contact-info h3 {
            color: #81c4f7;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .contact-info p {
            color: #e2e8f0;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .email-link {
            color: #81c4f7;
            text-decoration: none;
            font-weight: 600;
        }

        .email-link:hover {
            text-decoration: underline;
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .header-content {
                grid-template-columns: 1fr;
                gap: 15px;
                text-align: center;
            }

            .nav-links {
                justify-self: center !important;
            }

            h1 {
                order: -1;
            }

            .contact-container {
                padding: 20px 10px;
            }

            .page-title {
                font-size: 2rem;
            }

            .contact-form {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <div class="nav-links">
                    <a href="/" class="nav-link">Home</a>
                    <span class="nav-separator">|</span>
                    <a href="/" class="nav-link">How to Play</a>
                </div>
                <h1>⚽ Goaldle ⚽</h1>
                <div class="nav-links">
                    <a href="/faq" class="nav-link">FAQ</a>
                    <span class="nav-separator">|</span>
                    <a href="/contact" class="nav-link">Contact</a>
                </div>
            </div>
        </div>

        <div class="contact-container">

            <div class="contact-form">
                <h3 style="color: #81c4f7; margin-bottom: 20px; font-size: 1.3rem;">Send us a message</h3>

                <form id="contactForm">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" name="subject" required>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" placeholder="Tell us about your suggestion, bug report, or feedback..." required></textarea>
                    </div>

                    <button type="submit" class="submit-btn">Send Message</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const subject = document.getElementById('subject').value;
            const message = document.getElementById('message').value;

            // Create mailto link
            const mailto = `mailto:troycallen.dev@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(
                `Name: ${name}\nEmail: ${email}\n\nMessage:\n${message}`
            )}`;

            // Open email client
            window.location.href = mailto;
        });

        // Fix navigation links for both local and production
        function fixNavigationLinks() {
            const isLocal = window.location.protocol === 'file:';
            if (isLocal) {
                // Update links for local file testing
                document.querySelectorAll('a[href="/"]').forEach(link => {
                    link.href = 'goaldle-game.html';
                });
                document.querySelectorAll('a[href="/faq"]').forEach(link => {
                    link.href = 'faq.html';
                });
                document.querySelectorAll('a[href="/contact"]').forEach(link => {
                    link.href = 'contact.html';
                });
                // Keep relative favicon path for local
                document.getElementById('favicon').href = 'favicon.png';
            } else {
                // Use absolute path for production
                document.getElementById('favicon').href = '/favicon.png';
            }
        }

        // Initialize navigation fixes
        document.addEventListener('DOMContentLoaded', fixNavigationLinks);
    </script>
</body>
</html>
